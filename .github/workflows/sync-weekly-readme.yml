name: Sync Weekly Report to README

on:
  push:
    branches: [main]
    paths:
      - "weekly/20??-??-??.md"
      - "scripts/sync_latest_weekly_to_readme.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-weekly-readme
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync latest weekly report
        run: python scripts/sync_latest_weekly_to_readme.py

      - name: Commit normalized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md weekly/
          if git diff --cached --quiet; then
            echo "README and weekly reports are already up to date."
            exit 0
          fi
          git commit -m "docs: sync latest weekly update to README"
          git push
